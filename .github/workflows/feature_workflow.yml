name: Feature workflow

on:
  push:
    branches: 
      - feature/*
  
jobs:
  demo-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        
      - name: Build and test
        run: cd src/KaysBookClub.Test && dotnet test -p:NoWarn=*